<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>主選單 - 綜合管理系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" id="menuBox">
    <div class="user-info-bar">
      <!-- 依照您的要求，維持原本的排列：部門在前，人員在後 -->
      <span><span class="dept-badge" id="menuDept"></span> <span id="menuUser" style="font-weight:bold;"></span> 您好</span>
      <button class="btn-outline" onclick="logout()">登出</button>
    </div>
    <div class="header-title"><div class="sub-title">請選擇功能</div></div>
    
    <div class="menu-grid">
      <div class="menu-card" onclick="window.location.href='sign.html'">
        <span class="menu-icon">📝</span>
        <div class="menu-text">數位會簽本</div>
      </div>
      <div class="menu-card" onclick="window.location.href='duty.html'">
        <span class="menu-icon">📅</span>
        <div class="menu-text">數位值日簿</div>
      </div>
      <div class="menu-card" id="menuBtnDashboard" onclick="window.location.href='dashboard.html'">
        <span class="menu-icon">📊</span>
        <div class="menu-text">檢查量儀錶板</div>
      </div>
      <div class="menu-card" onclick="window.location.href='camera.html'">
        <span class="menu-icon">📸</span>
        <div class="menu-text">GPS相機</div>
      </div>
      
      <!-- [行政專屬] 自動產生問卷功能 -->
      <div class="menu-card" id="menuBtnSurvey" onclick="window.location.href='survey.html'" style="display: none;">
        <span class="menu-icon">📋</span>
        <div class="menu-text">自動產生問卷</div>
      </div>
      
      <!-- [新增的區域] 設備人員檢查種類統計總表 -->
      <!-- 預設隱藏 (display: none)，為解決手機版開啟問題改用 <a> 標籤 -->
      <a href="https://script.google.com/macros/s/AKfycbxWR5_iJc3TIDnruVi9CVCV_PwYoDQhM0zDe-OYF4srlcyNfzstq6Ult517DeqIerUVvQ/exec" target="_blank" rel="noopener noreferrer" class="menu-card" id="menuBtnEquipStats" style="display: none;">
        <span class="menu-icon">🧰</span>
        <div class="menu-text">設備人員檢查<br>種類統計總表</div>
      </a>
    </div>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/menu.js"></script>

  <!-- 新增：畫面渲染後動態權限控制腳本 -->
  <script>
    // 由於您的 js/menu.js 會非同步(API)載入資料，我們直接監聽畫面上的「部門」文字
    // 這樣 100% 不會因為 LocalStorage 的 Key 不對而導致判斷失敗
    const checkPermission = setInterval(() => {
        const deptEl = document.getElementById('menuDept');
        
        // 等待 menu.js 將部門文字填入 (只要不是空白就開始判斷)
        if (deptEl && deptEl.innerText.trim() !== "") {
            const actualDept = deptEl.innerText.trim();
            const btnEquipStats = document.getElementById('menuBtnEquipStats');
            
            if (btnEquipStats) {
                // 如果畫面上確實顯示了包含「設備」兩個字，就將按鈕顯示出來
                if (actualDept.includes("設備")) {
                    btnEquipStats.style.display = ""; 
                } else {
                    // 否則強制隱藏 (例如：機械、行政)
                    btnEquipStats.style.display = "none";
                }
            }

            const btnSurvey = document.getElementById('menuBtnSurvey');
            if (btnSurvey) {
                if (actualDept.includes("行政")) {
                    btnSurvey.style.display = "";
                } else {
                    btnSurvey.style.display = "none";
                }
            }
            
            // 判斷完畢後，停止這個定時檢查器以節省效能
            clearInterval(checkPermission);
        }
    }, 200); // 每 0.2 秒檢查一次，直到文字出現為止
  </script>
</body>
</html>
