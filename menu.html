<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>主選單 - 綜合管理系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 這裡保留了基礎排版 CSS，若您 css/style.css 裡已有設定可以將此區塊移除 */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .user-info-bar { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eaeaea; font-size: 1.05em; }
    .dept-badge { background: #0d6efd; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold; margin-right: 8px; }
    .header-title .sub-title { font-size: 1.2em; font-weight: bold; color: #444; margin-bottom: 15px; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
    .menu-card { background: #ffffff; border: 1px solid #e0e0e0; padding: 25px 15px; text-align: center; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: inherit; }
    .menu-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); border-color: #b3d4ff; }
    .menu-icon { font-size: 2.5em; margin-bottom: 12px; }
    .menu-text { font-size: 0.95em; color: #333; font-weight: 500; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="container" id="menuBox">
    <!-- 使用者資訊列：部門 + 姓名 -->
    <div class="user-info-bar">
      <span>
        <span class="dept-badge" id="menuDept">載入中</span>
        <span id="menuUser" style="font-weight:bold;"></span> 您好
      </span>
    </div>
    
    <div class="header-title"><div class="sub-title">請選擇功能</div></div>
    
    <div class="menu-grid">
      <div class="menu-card" onclick="window.location.href='sign.html'">
        <span class="menu-icon">📝</span>
        <div class="menu-text">數位會簽本</div>
      </div>
      <div class="menu-card" onclick="window.location.href='duty.html'">
        <span class="menu-icon">📅</span>
        <div class="menu-text">數位值日簿</div>
      </div>
      <div class="menu-card" id="menuBtnDashboard" onclick="window.location.href='dashboard.html'">
        <span class="menu-icon">📊</span>
        <div class="menu-text">檢查量儀錶板</div>
      </div>
      <div class="menu-card" onclick="window.location.href='camera.html'">
        <span class="menu-icon">📸</span>
        <div class="menu-text">GPS相機</div>
      </div>
      
      <!-- [新增的區域] 設備人員檢查種類統計總表 -->
      <a href="https://script.google.com/macros/s/AKfycbxWR5_iJc3TIDnruVi9CVCV_PwYoDQhM0zDe-OYF4srlcyNfzstq6Ult517DeqIerUVvQ/exec" target="_blank" rel="noopener noreferrer" class="menu-card" id="menuBtnEquipStats" style="display: none;">
        <span class="menu-icon">🧰</span>
        <div class="menu-text">設備人員檢查<br>種類統計總表</div>
      </a>

    </div>
  </div>

  <!-- 權限控制與畫面渲染腳本 (移到外部腳本之前，避免被其他 js 報錯中斷) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        // 1. 取得登入資訊
        let currentDept = localStorage.getItem('department') || sessionStorage.getItem('department') || "";
        let currentName = localStorage.getItem('userName') || sessionStorage.getItem('userName') || "";

        // 【關鍵修復】: 去除可能因為 JSON.stringify 存入時產生的多餘雙引號、單引號，以及前後空白
        let cleanDept = currentDept.replace(/['"]/g, '').trim();
        let cleanName = currentName.replace(/['"]/g, '').trim();

        // 2. 渲染部門與姓名到畫面上
        document.getElementById('menuDept').innerText = cleanDept;
        document.getElementById('menuUser').innerText = cleanName;

        // 3. 強化版權限判斷邏輯
        const btnEquipStats = document.getElementById('menuBtnEquipStats');
        
        if (btnEquipStats) {
            // 改用 includes 檢查，確保只要字串裡有「設備」兩個字就會強制顯示
            if (cleanDept.includes("設備")) {
                btnEquipStats.style.display = "flex"; 
                btnEquipStats.style.setProperty('display', 'flex', 'important'); // 加強權重，防 css 覆蓋
            } else {
                btnEquipStats.style.display = "none";
                btnEquipStats.style.setProperty('display', 'none', 'important');
            }
        }
    });
  </script>

  <!-- 引入您原本的 API 腳本 -->
  <script src="js/api.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
