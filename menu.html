<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>主選單 - 綜合管理系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* 這裡加入基礎 CSS 讓您能直接預覽版面效果，實際專案請維持引入外部 css/style.css */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .user-info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eaeaea; }
    .dept-badge { background: #0d6efd; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
    .btn-outline { border: 1px solid #dc3545; color: #dc3545; background: transparent; padding: 6px 16px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .btn-outline:hover { background: #dc3545; color: white; }
    .header-title .sub-title { font-size: 1.2em; font-weight: bold; color: #444; margin-bottom: 15px; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
    .menu-card { background: #ffffff; border: 1px solid #e0e0e0; padding: 25px 15px; text-align: center; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .menu-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); border-color: #b3d4ff; }
    .menu-icon { font-size: 2.5em; margin-bottom: 12px; }
    .menu-text { font-size: 0.95em; color: #333; font-weight: 500; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="container" id="menuBox">
    <div class="user-info-bar">
      <span><span class="dept-badge" id="menuDept">載入中...</span> <span id="menuUser" style="font-weight:bold;"></span> 您好</span>
      <button class="btn-outline" onclick="logout()">登出</button>
    </div>
    <div class="header-title"><div class="sub-title">請選擇功能</div></div>
    
    <div class="menu-grid">
      <div class="menu-card" onclick="window.location.href='sign.html'">
        <span class="menu-icon">📝</span>
        <div class="menu-text">數位會簽本</div>
      </div>
      <div class="menu-card" onclick="window.location.href='duty.html'">
        <span class="menu-icon">📅</span>
        <div class="menu-text">數位值日簿</div>
      </div>
      <div class="menu-card" id="menuBtnDashboard" onclick="window.location.href='dashboard.html'">
        <span class="menu-icon">📊</span>
        <div class="menu-text">檢查量儀錶板</div>
      </div>
      <div class="menu-card" onclick="window.location.href='camera.html'">
        <span class="menu-icon">📸</span>
        <div class="menu-text">GPS相機</div>
      </div>
      
      <!-- [新增的區域] 設備人員檢查種類統計總表 -->
      <!-- 預設加入 style="display: none;" 將其隱藏，並給予專屬 id -->
      <!-- 外部連結建議使用 window.open(..., '_blank') 另開分頁，以防使用者迷失在系統外 -->
      <div class="menu-card" id="menuBtnEquipStats" style="display: none;" onclick="window.open('https://script.google.com/macros/s/AKfycbxWR5_iJc3TIDnruVi9CVCV_PwYoDQhM0zDe-OYF4srlcyNfzstq6Ult517DeqIerUVvQ/exec', '_blank')">
        <span class="menu-icon">🧰</span>
        <div class="menu-text">設備人員檢查<br>種類統計總表</div>
      </div>

    </div>
  </div>
  
  <!-- 模擬您的 js/api.js 與 js/menu.js 運作邏輯 -->
  <script>
    // 模擬從後端 API 取得的使用者資料
    const userData = {
        name: "王小明",
        department: "設備"  // 💡 您可以試著把這裡改成 "廠務" 或其他部門，看看預覽畫面的變化
    };

    document.addEventListener("DOMContentLoaded", () => {
        // 1. 渲染使用者名稱與部門
        document.getElementById('menuDept').innerText = userData.department;
        document.getElementById('menuUser').innerText = userData.name;

        // 2. 依照「原本的模式」控制權限按鈕的顯示
        // 判斷部門是否為 "設備"
        if (userData.department === "設備") {
            // 如果是設備部門，就將原本隱藏的卡片顯示出來 (這裡因為使用了 flexbox，所以用 flex)
            document.getElementById('menuBtnEquipStats').style.display = "flex";
        }
    });

    function logout() {
        alert("執行登出動作！");
    }
  </script>
</body>
</html>
