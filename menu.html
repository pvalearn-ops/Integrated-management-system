<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>主選單 - 綜合管理系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" id="menuBox">
    <div class="user-info-bar">
      <!-- 依照您的要求，維持原本的排列：部門在前，人員在後 -->
      <span><span class="dept-badge" id="menuDept"></span> <span id="menuUser" style="font-weight:bold;"></span> 您好</span>
      <button class="btn-outline" onclick="logout()">登出</button>
    </div>
    <div class="header-title"><div class="sub-title">請選擇功能</div></div>
    
    <!-- 各卡片以 data-perm 對應帳號表欄位；預設隱藏，登入後由 menu.js 依權限顯示 -->
    <div class="menu-grid">
      <div class="menu-card" data-perm="sign" style="display: none;" onclick="window.location.href='sign.html'">
        <span class="menu-icon">📝</span>
        <div class="menu-text">數位會簽本</div>
      </div>
      <div class="menu-card" data-perm="duty" style="display: none;" onclick="window.location.href='duty.html'">
        <span class="menu-icon">📅</span>
        <div class="menu-text">數位值日簿</div>
      </div>
      <div class="menu-card" id="menuBtnDashboard" data-perm="dashboard" style="display: none;" onclick="window.location.href='dashboard.html'">
        <span class="menu-icon">📊</span>
        <div class="menu-text">檢查量儀錶板</div>
      </div>
      <div class="menu-card" data-perm="camera" style="display: none;" onclick="window.location.href='camera.html'">
        <span class="menu-icon">📸</span>
        <div class="menu-text">GPS相機</div>
      </div>

      <!-- 自動產生問卷 (帳號表 J 欄 survey) -->
      <div class="menu-card" id="menuBtnSurvey" data-perm="survey" style="display: none;" onclick="window.location.href='survey.html'">
        <span class="menu-icon">📋</span>
        <div class="menu-text">自動產生問卷</div>
      </div>

      <!-- 設備人員檢查種類統計總表 (帳號表 L 欄 equipStats)；用 <a> 標籤解決手機版開啟問題 -->
      <a href="https://script.google.com/macros/s/AKfycbxWR5_iJc3TIDnruVi9CVCV_PwYoDQhM0zDe-OYF4srlcyNfzstq6Ult517DeqIerUVvQ/exec" target="_blank" rel="noopener noreferrer" class="menu-card" id="menuBtnEquipStats" data-perm="equipStats" style="display: none;">
        <span class="menu-icon">🧰</span>
        <div class="menu-text">設備人員檢查<br>種類統計總表</div>
      </a>

      <!-- 讓渡派件 (帳號表 F 欄 transfer) -->
      <div class="menu-card" data-perm="transfer" style="display: none;" onclick="window.location.href='transfer.html'">
        <span class="menu-icon">⚡</span>
        <div class="menu-text">讓渡派件</div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
