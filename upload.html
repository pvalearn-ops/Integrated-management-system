<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>上傳掃描檔 - 綜合管理系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .up-section { border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .drop-zone { border: 2px dashed #9aa0a6; border-radius: 8px; padding: 30px 15px; text-align: center; color: #5f6368; cursor: pointer; transition: 0.2s; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #1a73e8; background: #e8f0fe; color: #1967d2; }
    .pick-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .pick-row input[type="text"] { margin: 0; flex: 1; }
    .pick-size { color: #80868b; font-size: 0.85em; white-space: nowrap; }
    .btn-x { background: none; border: none; color: #d93025; font-size: 18px; cursor: pointer; padding: 0 4px; }
    .year-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .year-bar input { width: 70px; margin: 0; padding: 6px; text-align: center; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; }
    .target-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
    .target-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 6px; cursor: pointer; user-select: none; }
    .target-item:hover { border-color: #1a73e8; }
    .target-item.checked { background: #e8f0fe; border-color: #1a73e8; }
    .target-item input { width: 18px; height: 18px; margin: 0; flex-shrink: 0; }
    .target-name { flex: 1; }
    .target-sub { color: #80868b; font-size: 0.85em; }
    .local-actions { display: flex; gap: 6px; }
    .local-actions button { font-size: 0.8em; padding: 2px 8px; }
    .group-label { font-size: 0.85em; color: #80868b; margin: 12px 0 6px; }
    .notice { background: #fef7e0; color: #b06000; padding: 10px; border-radius: 6px; font-size: 0.9em; }
    .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
    .opt-row input { width: 18px; height: 18px; margin: 0; }
    .log-box { margin-top: 15px; }
    .log-line { padding: 6px 10px; border-radius: 4px; margin-bottom: 4px; font-size: 0.92em; word-break: break-all; }
    .log-ok { background: #e6f4ea; color: #137333; }
    .log-err { background: #fce8e6; color: #c5221f; }
    .log-info { background: #f1f3f4; color: #3c4043; }
  </style>
</head>
<body>
  <div class="container">
    <div class="user-info-bar">
      <span><span class="dept-badge" id="upDept"></span> <span id="upUser" style="font-weight:bold;"></span> 您好</span>
      <button class="btn-secondary" onclick="window.location.href='menu.html'">回主選單</button>
    </div>
    <div class="header-title"><div class="sub-title">上傳掃描檔</div></div>

    <!-- 1. 選擇檔案 -->
    <div class="up-section">
      <div class="section-title"><span>1. 選擇檔案</span></div>
      <div class="drop-zone" id="dropZone">📄 點此選擇檔案，或把檔案拖曳到這裡（可多選）</div>
      <input type="file" id="fileInput" multiple class="hidden">
      <div id="pickedList" style="margin-top:12px;"></div>
    </div>

    <!-- 2. 雲端位置 -->
    <div class="up-section">
      <div class="section-title"><span>2. 雲端位置</span></div>
      <div class="year-bar">
        年度資料夾：民國
        <button class="btn-secondary" onclick="changeYear(-1)">－</button>
        <input type="number" id="rocYear" onchange="renderTargets()">
        <button class="btn-secondary" onclick="changeYear(1)">＋</button>
        年
        <span class="target-sub">（套用於標示「依年度」的位置；資料夾不存在會自動建立）</span>
      </div>
      <div class="target-grid" id="cloudTargets"></div>
    </div>

    <!-- 3. 本機位置 -->
    <div class="up-section">
      <div class="section-title">
        <span>3. 本機位置</span>
        <button class="btn-outline" id="btnAddLocal" onclick="addLocalTarget()">＋ 新增本機位置</button>
      </div>
      <div id="localUnsupported" class="notice hidden">此瀏覽器不支援寫入本機資料夾，請改用電腦版 Chrome 或 Edge。</div>
      <div class="target-grid" id="localTargets"></div>
    </div>

    <div class="opt-row hidden" id="deleteOptRow">
      <input type="checkbox" id="optDeleteOriginal" checked>
      <label for="optDeleteOriginal">全部上傳成功後，刪除原始檔（等同移動）</label>
    </div>

    <button class="btn-primary" id="btnUpload" onclick="startUpload()">開始上傳</button>
    <div class="log-box" id="logBox"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
